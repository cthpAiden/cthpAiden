<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Animated underwater banner: Clawd the Claude Code mascot floating among ASCII fish, with the name Phuc Chau"><title>Phuc Chau, Clawd's aquarium</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
.swimR{animation:swimR linear infinite}
.swimL{animation:swimL linear infinite}
.bob{animation:bob ease-in-out infinite alternate}
.jelly{animation:jelly ease-in-out infinite alternate}
.b{animation:rise linear infinite}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
.wvL{animation:wvL linear infinite}
.wvR{animation:wvR linear infinite}
.cur{animation:blink 1.1s steps(1) infinite}
.ray{animation:ray ease-in-out infinite alternate}
.cl{animation:clbob 3.6s ease-in-out infinite alternate}
.ey{transform-box:fill-box;transform-origin:50% 50%;animation:eyeblink 4.5s infinite}
.arR{transform-box:fill-box;transform-origin:0% 50%;animation:waveR 2.6s ease-in-out infinite}
.arL{transform-box:fill-box;transform-origin:100% 50%;animation:waveL 2.6s ease-in-out -1.3s infinite}
@keyframes swimR{from{transform:translateX(-280px)}to{transform:translateX(1180px)}}
@keyframes swimL{from{transform:translateX(1180px)}to{transform:translateX(-280px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(10px)}}
@keyframes jelly{from{transform:translateY(0)}to{transform:translateY(-28px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-300px);opacity:0}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes wvL{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes wvR{from{transform:translateX(-900px)}to{transform:translateX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ray{from{opacity:.35}to{opacity:1}}
@keyframes clbob{from{transform:translateY(0)}to{transform:translateY(8px)}}
@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.swimR{transform:translateX(120px)}
.swimL{transform:translateX(560px)}
.b{opacity:.6}
}
